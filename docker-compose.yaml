services:

  snapcast:
    image: phlak/snapcast-server:${SNAPCAST_VERSION:-latest}
    env_file: environment.d/snapcast.env
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ${SNAPSERVER_CONFIG_PATH:-./volumes/snapcast/snapserver.conf}:/etc/snapserver.conf:ro
      - ${SNAPCAST_CACHE_VOLUME:-snapcast-cache}:/var/cache/snapserver
      - ${SNAPCAST_DATA_VOLUME:-snapcast-data}:/var/lib/snapserver
      - /etc/localtime:/etc/localtime:ro
    labels:
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_VERSION:-latest}
    env_file: environment.d/watchtower.env
    environment:
      WATCHTOWER_SCOPE: ${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    labels:
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped

volumes:
  snapcast-cache: {}
  snapcast-data: {}
